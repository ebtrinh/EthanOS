<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EthanOS — Schedule</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-shell"></div>
  <main class="main-content" id="page-content">
    <div class="page-header flex-between">
      <div>
        <h1 class="page-title">Schedule</h1>
        <p class="page-subtitle" id="cal-subtitle">February 2025</p>
      </div>
      <div class="flex gap-1">
        <button class="btn btn-sm" id="cal-prev">&larr;</button>
        <button class="btn btn-sm" id="cal-today">Today</button>
        <button class="btn btn-sm" id="cal-next">&rarr;</button>
        <div class="flex gap-1" style="margin-left:var(--space-md)">
          <button class="btn btn-sm" id="cal-month-btn">Month</button>
          <button class="btn btn-sm" id="cal-week-btn">Week</button>
          <button class="btn btn-sm" id="cal-day-btn">Day</button>
        </div>
        <button class="btn btn-primary btn-sm" id="cal-add-btn">+ Event</button>
      </div>
    </div>
    <div id="cal-container" class="card" style="padding:0;overflow:hidden;"></div>
  </main>
  <div id="modal-root"></div>
  <div id="toast-container"></div>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EthanOS — Academic Brain</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-shell"></div>
  <main class="main-content" id="page-content">
    <div class="page-header flex-between">
      <div>
        <h1 class="page-title">Academic Brain</h1>
        <p class="page-subtitle">Manage all your tasks and assignments</p>
      </div>
      <button class="btn btn-primary" id="add-task-btn">+ Add Task</button>
    </div>

    <!-- Controls -->
    <div class="flex flex-wrap gap-2 mb-3 items-center">
      <div style="min-width:160px">
        <select id="sort-select">
          <option value="dueDate">Sort: Due Date</option>
          <option value="difficulty">Sort: Difficulty</option>
          <option value="estimate">Sort: Time Estimate</option>
        </select>
      </div>
      <div style="min-width:160px">
        <select id="filter-category">
          <option value="all">All Categories</option>
        </select>
      </div>
      <div class="flex-1"></div>
      <div class="flex gap-1 items-center">
        <span class="badge badge-danger" id="overdue-count">0 overdue</span>
        <span class="badge badge-warning" id="due-soon-count">0 due soon</span>
        <span class="badge badge-success" id="completed-count">0 completed</span>
      </div>
    </div>

    <!-- Task List -->
    <div id="task-list">
      <div class="empty-state">
        <div class="empty-state-icon">&#128218;</div>
        <div class="empty-state-title">No tasks yet</div>
        <div class="empty-state-text">Click "Add Task" to create your first task</div>
      </div>
    </div>
  </main>
  <div id="modal-root"></div>
  <div id="toast-container"></div>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/academic.js"></script>
</body>
</html>

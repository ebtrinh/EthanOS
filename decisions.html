<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EthanOS — Decision Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-shell"></div>
  <main class="main-content" id="page-content">
    <div class="page-header">
      <h1 class="page-title">Decision Simulator</h1>
      <p class="page-subtitle">Model "what if" scenarios using your real data</p>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="decision-tabs">
      <button class="tab active" data-tab="skip">What if I skip a task?</button>
      <button class="tab" data-tab="hours">What if I add hours?</button>
    </div>

    <!-- Tab 1: Skip Task -->
    <div id="tab-skip">
      <div class="card mb-3">
        <div class="card-header">
          <h2 class="card-title">Select a Task to Skip</h2>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">Task</label>
            <select id="skip-task-select"><option value="">-- Choose a task --</option></select>
          </div>
        </div>
      </div>
      <div id="skip-results" class="grid-3"></div>
    </div>

    <!-- Tab 2: Add Hours -->
    <div id="tab-hours" class="hidden">
      <div class="card mb-3">
        <div class="card-header">
          <h2 class="card-title">Add Hours to a Category</h2>
        </div>
        <div class="card-body">
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Category</label>
              <select id="hours-cat-select"><option value="">-- Choose a category --</option></select>
            </div>
            <div class="form-group">
              <label class="form-label">Extra hours per week</label>
              <input type="number" id="hours-input" min="1" max="40" value="5">
            </div>
          </div>
        </div>
      </div>
      <div id="hours-results" class="grid-3"></div>
    </div>
  </main>
  <div id="modal-root"></div>
  <div id="toast-container"></div>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/decisions.js"></script>
</body>
</html>

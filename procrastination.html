<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EthanOS — Procrastination Predictor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-shell"></div>
  <main class="main-content" id="page-content">
    <div class="page-header">
      <h1 class="page-title">Procrastination Predictor</h1>
      <p class="page-subtitle">Know your risk before it strikes</p>
    </div>

    <div class="grid-stats mb-3" id="stats-row"></div>

    <div class="card mb-3" id="weekly-score-card">
      <div class="card-header">
        <h2 class="card-title">Weekly Procrastination Score</h2>
        <span id="weekly-score-badge" class="badge"></span>
      </div>
      <div id="weekly-score-bar"></div>
      <p class="text-sm text-secondary mt-2" id="weekly-score-text"></p>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Upcoming Tasks</h2>
        <span class="text-sm text-muted" id="task-count"></span>
      </div>
      <div id="task-list"></div>
    </div>
  </main>
  <div id="modal-root"></div>
  <div id="toast-container"></div>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/procrastination.js"></script>
</body>
</html>

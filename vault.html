<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EthanOS — Knowledge Vault</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .vault-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: var(--space-lg);
      min-height: 60vh;
    }
    @media (max-width: 768px) {
      .vault-layout { grid-template-columns: 1fr; }
    }
    .vault-sidebar { display: flex; flex-direction: column; gap: var(--space-md); }
    .vault-filters { display: flex; gap: var(--space-sm); flex-wrap: wrap; }
    .note-list { flex: 1; overflow-y: auto; max-height: 65vh; }
    .note-item {
      padding: var(--space-md);
      border-radius: var(--border-radius-md);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all var(--transition-fast);
      margin-bottom: var(--space-sm);
    }
    .note-item:hover { background: var(--accent-subtle); }
    .note-item.selected { border-color: var(--accent); background: var(--accent-subtle); }
    .note-item-title {
      font-weight: 600;
      font-size: var(--font-size-md);
      color: var(--text-primary);
      margin-bottom: var(--space-xs);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note-item-meta {
      font-size: var(--font-size-xs);
      color: var(--text-muted);
      display: flex;
      gap: var(--space-sm);
      align-items: center;
    }
    .note-tags { display: flex; gap: var(--space-xs); flex-wrap: wrap; margin-top: var(--space-xs); }
    .tag-pill {
      padding: 2px 8px;
      background: var(--bg-primary);
      border-radius: 12px;
      font-size: var(--font-size-xs);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .tag-pill.active { background: var(--accent-subtle); color: var(--accent); }
    .editor-area textarea { min-height: 300px; }
    .editor-tags-input { width: 100%; }
  </style>
</head>
<body>
  <div id="app-shell"></div>
  <main class="main-content" id="page-content">
    <div class="page-header flex-between">
      <div>
        <h1 class="page-title">Knowledge Vault</h1>
        <p class="page-subtitle">Your personal knowledge base</p>
      </div>
      <div class="flex gap-2 items-center">
        <span class="text-sm text-muted" id="note-count"></span>
        <button class="btn btn-primary btn-sm" id="btn-new-note">+ New Note</button>
      </div>
    </div>

    <div class="vault-layout">
      <div class="vault-sidebar">
        <input type="search" id="search-input" placeholder="Search notes..." />
        <div class="vault-filters">
          <select id="filter-category">
            <option value="">All categories</option>
          </select>
          <select id="sort-select">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="category">Category</option>
          </select>
        </div>
        <div id="tag-filter-row" class="note-tags"></div>
        <div class="note-list" id="note-list"></div>
      </div>

      <div class="card" id="editor-panel">
        <div id="editor-content"></div>
      </div>
    </div>
  </main>
  <div id="modal-root"></div>
  <div id="toast-container"></div>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/vault.js"></script>
</body>
</html>
